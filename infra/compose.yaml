name: karry

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: karry-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-karry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-karry_dev}
      POSTGRES_DB: ${POSTGRES_DB:-karry}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-karry} -d ${POSTGRES_DB:-karry}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: karry-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: karry-minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-karry}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-karry_dev_minio}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

  math-engine:
    build:
      context: ../src/math-engine
      dockerfile: ../../infra/docker/math-engine.Dockerfile
    container_name: karry-math-engine
    ports:
      - '8000:8000'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../src/backend
      dockerfile: ../../infra/docker/backend.Dockerfile
    container_name: karry-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__KarryDatabase: 'Host=postgres;Port=5432;Database=${POSTGRES_DB:-karry};Username=${POSTGRES_USER:-karry};Password=${POSTGRES_PASSWORD:-karry_dev}'
      Redis__ConnectionString: 'redis:6379'
      MathEngine__BaseUrl: 'http://math-engine:8000'
      Jwt__Secret: ${JWT_SECRET:-CHANGE_ME_IN_DEV_ONLY_NOT_FOR_PROD}
      Database__AutoMigrate: 'true'
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      math-engine:
        condition: service_healthy

  frontend:
    build:
      context: ../src/frontend
      dockerfile: ../../infra/docker/frontend.Dockerfile
    container_name: karry-frontend
    ports:
      - '5173:5173'
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
