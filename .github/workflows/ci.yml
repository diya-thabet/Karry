name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore Karry.sln
      - name: Build
        run: dotnet build Karry.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test Karry.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: src/backend/**/TestResults/*.trx

  frontend:
    name: Frontend (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  math-engine:
    name: Math Engine (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/math-engine
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Test
        run: pytest

  docker-images:
    name: Docker image build & push
    runs-on: ubuntu-latest
    needs: [backend, frontend, math-engine]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: src/backend
          file: infra/docker/backend.Dockerfile
          push: true
          tags: dhiathabet/karry-backend:${{ github.sha }},dhiathabet/karry-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push math-engine image
        uses: docker/build-push-action@v6
        with:
          context: src/math-engine
          file: infra/docker/math-engine.Dockerfile
          push: true
          tags: dhiathabet/karry-math-engine:${{ github.sha }},dhiathabet/karry-math-engine:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: src/frontend
          file: infra/docker/frontend.Dockerfile
          push: true
          tags: dhiathabet/karry-frontend:${{ github.sha }},dhiathabet/karry-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
