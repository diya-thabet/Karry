name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore Karry.sln
      - name: Build
        run: dotnet build Karry.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test Karry.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: src/backend/**/TestResults/*.trx

  frontend:
    name: Frontend (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  math-engine:
    name: Math Engine (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/math-engine
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Test
        run: pytest

  docker-images:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [backend, frontend, math-engine]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f infra/docker/backend.Dockerfile -t karry/backend:ci src/backend
      - name: Build math-engine image
        run: docker build -f infra/docker/math-engine.Dockerfile -t karry/math-engine:ci src/math-engine
      - name: Build frontend image
        run: docker build -f infra/docker/frontend.Dockerfile -t karry/frontend:ci src/frontend
